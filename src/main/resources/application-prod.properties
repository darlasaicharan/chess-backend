# Server
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
server.forward-headers-strategy=framework

# Application
spring.application.name=neonmate-chess-backend

# PostgreSQL - Render
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=NeonmateHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2
spring.h2.console.enabled=false

# JWT
neonmate.jwt.secret=${NEONMATE_JWT_SECRET}
neonmate.jwt.expiration-ms=86400000
neonmate.jwt.refresh-expiration-ms=604800000

# CORS
neonmate.cors.allowed-origins=${NEONMATE_CORS_ALLOWED_ORIGINS:https://chess-frontend-lime-one.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:3000}

# Stockfish
neonmate.stockfish.path=
neonmate.stockfish.default-depth=18
neonmate.stockfish.max-depth=32

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

























