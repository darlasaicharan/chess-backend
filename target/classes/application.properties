# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Spring Application
spring.application.name=neonmate-chess-backend

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/neonmatedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
neonmate.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
neonmate.jwt.expiration-ms=86400000
neonmate.jwt.refresh-expiration-ms=604800000

# CORS Configuration
neonmate.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Stockfish Chess Engine
neonmate.stockfish.path=
neonmate.stockfish.default-depth=18
neonmate.stockfish.max-depth=32

# Swagger & OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
